            fi

            echo "=== Cloning execution-plane at ${EP_REVISION} on remote VM ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              EP_CLONE_URL=\"${EP_GIT_URL/https:\/\//https:\/\/x-access-token:${GH_TOKEN}@}\"
              if [ -d ~/syntara-execution-plane ]; then
