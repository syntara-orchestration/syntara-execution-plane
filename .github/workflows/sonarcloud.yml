---
name: SonarCloud Upload

# Fork fallback: this workflow is loaded from the default branch and runs after
# PR CI completes. Same-repository PRs use the inline SonarCloud job in ci.yml.
# It checks out fork-controlled source for inspection only. The scanner
# configuration is restored from the base repository, PR metadata is validated
# against the triggering run, the SonarCloud host is pinned, and no repository
# code from the PR is executed.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Upload
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.event.workflow_run.repository.full_name
    steps:
      - name: Fetch PR number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ep-pr-number
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          if-no-files-found: error

      - name: Get and validate PR information
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pr_number="$(tr -cd '0-9' < pr-number.txt)"
          if [[ -z "$pr_number" ]]; then
            echo "PR number artifact did not contain a valid number" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}")"
          pr_head_repository="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          pr_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          expected_head_repository="${{ github.event.workflow_run.head_repository.full_name }}"
          expected_head_sha="${{ github.event.workflow_run.head_sha }}"

          if [[ "$pr_head_repository" != "$expected_head_repository" || "$pr_head_sha" != "$expected_head_sha" ]]; then
            echo "PR ${pr_number} does not match workflow run head ${expected_head_repository}@${expected_head_sha}" >&2
            exit 1
          fi

          pr_base="$(jq -r '.base.ref' <<< "$pr_json")"
          pr_head="$(jq -r '.head.ref' <<< "$pr_json")"

          {
            printf 'number=%s\n' "$pr_number"
            printf 'base=%s\n' "$pr_base"
            printf 'head=%s\n' "$pr_head"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          # Safe opt-in: workflow_run loads this trusted default-branch
          # definition, all actions are pinned, PR/run identity is validated,
          # scanner configuration comes from the base repository, SonarCloud is
          # pinned, credentials are not persisted, and no fork-provided scripts
          # are executed. The pinned scanner only consumes source and reports.
          allow-unsafe-pr-checkout: true
          path: pr
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Restore trusted scanner configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/contents/sonar-project.properties" --jq .content | base64 -d > pr/sonar-project.properties

      - name: Download combined coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ep-coverage-combined
          path: pr
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          if-no-files-found: error

      - name: Check coverage files
        run: |
          set -euo pipefail
          test -s pr/coverage.xml
          test -s pr/pytest-results.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
          SONARCLOUD_URL: https://sonarcloud.io
        with:
          projectBaseDir: pr
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=syntara-orchestration_syntara-execution-plane
            -Dsonar.organization=syntara-orchestration
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.pullrequest.key=${{ steps.pr.outputs.number }}
            -Dsonar.pullrequest.branch=${{ steps.pr.outputs.head }}
            -Dsonar.pullrequest.base=${{ steps.pr.outputs.base }}
