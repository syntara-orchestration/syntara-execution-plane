            echo "=== Cloning syntara-step-types at ${STEP_TYPES_REVISION} on remote VM ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              ST_CLONE_URL=\"${STEP_TYPES_GIT_URL/https:\/\//https:\/\/x-access-token:${GH_TOKEN}@}\"
              if [ -d ~/syntara-step-types ]; then
                git -C ~/syntara-step-types fetch --all
              else
                git clone \"\${ST_CLONE_URL}\" ~/syntara-step-types
              fi
              if [ -n '${STEP_TYPES_PR_NUMBER}' ]; then
                git -C ~/syntara-step-types fetch origin refs/pull/${STEP_TYPES_PR_NUMBER}/head
