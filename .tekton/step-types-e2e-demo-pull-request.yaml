        - name: link-ao-sources
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            echo "=== Creating syntara source symlinks in aap-dev ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              rm -f ~/aap-dev/src/nexus ~/aap-dev/src/syntara ~/aap-dev/src/nexus-ui ~/aap-dev/src/syntara-ui
              mkdir -p ~/aap-dev/src
              ln -s ~/syntara/backend ~/aap-dev/src/syntara
              ln -s ~/syntara/frontend ~/aap-dev/src/syntara-ui
              # aap-dev#1023 only overlays a source when it is named in
              # src/sources.yaml. Directory/symlink presence is no longer enough.
              printf '%s\n' \
                '---' \
                '- app: ao' \
                '  sources:' \
                '    - name: syntara' \
                '    - name: syntara-ui' \
                > ~/aap-dev/src/sources.yaml
            "
        - name: build-ao
          timeout: 1h
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            echo "=== Relabeling source files for container builds (SELinux) ==="
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              sudo chcon -R -t container_file_t ~/syntara ~/aap-dev/src
            "

            echo "=== Building AO images (ao-operator mode) ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              cd ~/aap-dev
              export AO_OPERATOR_BUNDLE_IMAGE=${AO_OPERATOR_BUNDLE_IMAGE}
              # AO_EXECUTION_PLANE when ep-revision is set: aap-dev's ensure-ep-from-src
              # overlays ~/syntara-execution-plane into src/ and the ep image builds from
              # that checkout; the operator deploys the EP control plane. Empty ep-revision
              # keeps today's behavior (no EP).
              # EP enabled when explicitly requested, or when a git source is pinned
              # (building from source implies the opt-in). With the flag on and no
              # ep-revision, aap-dev deploys the prebuilt quay.io/aap EP image.
              export AO_EXECUTION_PLANE='$(if [ "${ENABLE_EXECUTION_PLANE}" = "true" ] || [ -n "${EP_REVISION}" ]; then echo true; else echo false; fi)'
              make AO_OPERATOR=true SKAFFOLD_CONFIG=\$(pwd)/skaffolding/skaffold-ao-operator.yaml aap-build 2>&1 | tee /tmp/aap-build.log
              if grep -qE 'Skipping context syntara(-ui)?: directory exists but not configured' /tmp/aap-build.log; then
                echo 'ERROR: aap-dev skipped overlaying syntara sources (src/sources.yaml is not configured).' >&2
                exit 1
              fi
            "
        - name: deploy-ao
          timeout: 30m
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            QUAY_USERNAME=$(cat /credentials/registry/quay-username 2>/dev/null || echo "")
            QUAY_TOKEN=$(cat /credentials/registry/quay-token 2>/dev/null || echo "")
            RH_REGISTRY_USER=$(cat /credentials/registry/rh-registry-username 2>/dev/null || echo "")
            RH_REGISTRY_TOKEN=$(cat /credentials/registry/rh-registry-token 2>/dev/null || echo "")

            echo "=== Deploying AO via OLM operator (ao-operator mode) ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              cd ~/aap-dev
              export AO_OPERATOR_BUNDLE_IMAGE=${AO_OPERATOR_BUNDLE_IMAGE}
              export QUAY_USERNAME='${QUAY_USERNAME}'
              export QUAY_PASSWORD='${QUAY_TOKEN}'
              export RHN_USERNAME='${RH_REGISTRY_USER}'
              export RHN_PASSWORD='${RH_REGISTRY_TOKEN}'
              export AO_INGRESS_PORT=17455
              export AO_INGRESS_NODEPORT=30443
              export AO_BACKEND_REPLICAS='${AO_BACKEND_REPLICAS}'
              # AO_EXECUTION_PLANE when ep-revision is set: aap-dev's ensure-ep-from-src
              # overlays ~/syntara-execution-plane into src/ and the ep image builds from
              # that checkout; the operator deploys the EP control plane. Empty ep-revision
              # keeps today's behavior (no EP).
              # EP enabled when explicitly requested, or when a git source is pinned
              # (building from source implies the opt-in). With the flag on and no
              # ep-revision, aap-dev deploys the prebuilt quay.io/aap EP image.
              export AO_EXECUTION_PLANE='$(if [ "${ENABLE_EXECUTION_PLANE}" = "true" ] || [ -n "${EP_REVISION}" ]; then echo true; else echo false; fi)'
              make AO_OPERATOR=true SKAFFOLD_CONFIG=\$(pwd)/skaffolding/skaffold-ao-operator.yaml aap-deploy || {
                echo '=== aap-deploy failed; collecting diagnostics before teardown ==='
                export KUBECONFIG=\$HOME/aap-dev/.tmp/27-next-ao-operator.kubeconfig
                echo '--- AutomationOrchestrator CR myao (status/conditions) ---'
                kubectl get automationorchestrator myao -o yaml 2>&1 | tail -80 || true
                echo '--- myao-admin-settings ConfigMap ---'
                kubectl get configmap myao-admin-settings -o yaml 2>&1 || true
                echo '--- pods in aap27-next ---'
                kubectl get pods -n aap27-next -o wide 2>&1 || true
                echo '--- operator logs (last 200 lines) ---'
                kubectl logs -n aap27-next deployment/automation-orchestrator-operator-controller-manager --tail=200 2>&1 || true
                echo '--- recent events ---'
                kubectl get events -n aap27-next --sort-by=.lastTimestamp 2>&1 | tail -40 || true
                exit 1
              }
              mkdir -p \$HOME/aap-dev/.tmp
              \$HOME/aap-dev/bin/kind export kubeconfig \
                --name 27-next-ao-operator \
                --kubeconfig \$HOME/aap-dev/.tmp/27-next-ao-operator.kubeconfig
              kubectl --kubeconfig=\$HOME/aap-dev/.tmp/27-next-ao-operator.kubeconfig \
                config set-context kind-27-next-ao-operator --namespace=aap27-next
            "
        - name: wait-for-ao-ready
          timeout: 15m
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)
            AO_KUBECONFIG="\$HOME/aap-dev/.tmp/27-next-ao-operator.kubeconfig"

            echo "=== Waiting for AutomationOrchestrator CR to reach Ready condition ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              export KUBECONFIG=${AO_KUBECONFIG}
              kubectl wait automationorchestrator/myao \
                --for=condition=Ready \
                --timeout=600s
            "
        - name: configure-ao
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)
            AO_KUBECONFIG="\$HOME/aap-dev/.tmp/27-next-ao-operator.kubeconfig"

            echo "=== Configuring AO for E2E tests ==="
            # Mirrors the two post-deploy steps in syntara's e2e-ao-operator.yml:
            #   1. Allow private-IP HTTP requests (worker needs myao-backend and the
            #      in-cluster httpbin Service that aap-dev deploys for E2E HTTP Request
            #      tests). Replacing this list with only myao-backend SSRF-blocks
            #      http://httpbin:8080 ("SSRF blocked: private IP range").
            #   2. Bump Redis connection pool for E2E concurrency
            # No memory limits or operator scale-down — the GHA reference workflow does neither.
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              export KUBECONFIG=${AO_KUBECONFIG}

              kubectl patch automationorchestrator/myao --type=merge \
                -p '{\"spec\":{\"workflowHttpRequestAllowedHosts\":[\"myao-backend\",\"httpbin\"]}}'
              kubectl set env deployment/myao-worker \
                APP_WORKFLOW_HTTP_REQUEST_ALLOWED_HOSTS='[\"myao-backend\",\"httpbin\"]'
              kubectl rollout status deployment/myao-worker --timeout=300s

              kubectl set env deployment/myao-backend \
                APP_CACHE_CONNECTION_POOL_SIZE=50 \
                APP_SCRIPT_NODES_ENABLED=true \
                APP_INTEGRATION_URL_ALLOWED_HOSTS='[\"mcp-server\",\"localhost\"]'
              kubectl set env deployment/myao-worker \
                APP_CACHE_CONNECTION_POOL_SIZE=50 \
                APP_SCRIPT_NODES_ENABLED=true
              kubectl rollout status deployment/myao-backend --timeout=300s
              kubectl rollout status deployment/myao-worker --timeout=300s
            "
        - name: initialize-admin-password
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)
            AO_KUBECONFIG="\$HOME/aap-dev/.tmp/27-next-ao-operator.kubeconfig"

            # The operator creates myao-initial-admin-password (key: password) during
            # the backend DB migration job. Retrieve it instead of generating a new one.
            # shellcheck disable=SC2029
            AO_ADMIN_PASSWORD=$(ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              kubectl --kubeconfig=${AO_KUBECONFIG} get secret myao-initial-admin-password \
                -n aap27-next \
                -o jsonpath='{.data.password}' | base64 -d
            ")
            printf '%s' "${AO_ADMIN_PASSWORD}" > /workspace/share/ao-admin-password
        - name: expose-ao-ingress
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)
            AO_ADMIN_PASSWORD=$(cat /workspace/share/ao-admin-password)
            AO_KUBECONFIG="\$HOME/aap-dev/.tmp/27-next-ao-operator.kubeconfig"

            echo "=== Starting kubectl port-forward for AO ingress on VM ==="
            # Rootless podman ports aren't on the real host loopback, so the
            # SSH tunnel can't reach them directly. Port-forward the nginx
            # ingress controller which serves HTTPS on port 443.
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              export KUBECONFIG=${AO_KUBECONFIG}
              nohup kubectl port-forward -n ingress-nginx svc/ingress-nginx-controller 8443:443 --address=0.0.0.0 > /tmp/port-forward.log 2>&1 &
              sleep 5
              curl -ksSf https://127.0.0.1:8443/health 2>&1 | head -3 || echo 'Health check failed'
            "

            AO_URL="https://${SSH_HOST}:8443"

            echo "AO URL: ${AO_URL}"
            printf '%s' "${AO_URL}" > "$(results.ao-url.path)"
            printf '%s' "${AO_URL}" > "$(results.ao-worker-url.path)"
            printf '%s' "${AO_ADMIN_PASSWORD}" > "$(results.ao-admin-password.path)"
            printf '%s' "${SSH_HOST}" > "$(results.ao-host.path)"
    - name: run-step-types-e2e
      timeout: 15m
      runAfter:
      - deploy-ao
      taskSpec:
        description: Run ONE lightweight syntara-step-types dispatch e2e on the Kind cluster, from the
          checkout deploy-ao cloned to ~/syntara-step-types (this PR's head). konflux-run-e2e.sh (with
          E2E_PYTEST_TARGET) dispatches the script-bash SDK image's example workload through the AO
          API and asserts the business result.
        params:
        - name: ssh-credentials-secret
          type: string
        volumes:
        - name: ssh-credentials-volume
          secret:
            secretName: $(params.ssh-credentials-secret)
        steps:
        - name: run-e2e
          image: quay.io/aap-ci/tekton-catalog/task-runner/ansible:0.1@sha256:9f5357ab53e03a1f5074f78afea59c516c4048cb189dc0e5a56688e0f336d151
          volumeMounts:
          - name: ssh-credentials-volume
            mountPath: /credentials/ssh
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_KEY=/tmp/id_rsa
            cp /credentials/ssh/id_rsa "${SSH_KEY}"
            chmod 600 "${SSH_KEY}"

            SSH_HOST=$(cat /credentials/ssh/host)
            SSH_USER=$(cat /credentials/ssh/username 2>/dev/null || echo "ec2-user")
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            echo "=== Running the lightweight script-bash SDK-image e2e on the Kind cluster ==="
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              # Discover the kubeconfig: its name derives from the AAP version
              # (e.g. 27-next-ao-operator.kubeconfig), so do not hardcode it.
              KUBECONFIG=\$(ls -1 \$HOME/aap-dev/.tmp/*.kubeconfig 2>/dev/null | head -1)
              if [ -z \$KUBECONFIG ]; then
                echo 'ERROR: no kubeconfig in ~/aap-dev/.tmp — AO was not deployed' >&2
                exit 1
              fi
              export KUBECONFIG
              # Lightweight run: a single test exercising one SDK image
              # (script-bash) instead of the whole per-plugin suite.
              export E2E_PYTEST_TARGET='tests/e2e/test_script_dispatch.py::test_script_bash_example_dispatches_and_completes'
              bash \$HOME/syntara-step-types/tools/konflux-run-e2e.sh
            "
      params:
      - name: ssh-credentials-secret
        value: ssh-credentials-$(context.pipelineRun.name)
    finally:
    - name: collect-kubernetes-logs-on-failure
      when:
      - input: $(tasks.status)
        operator: in
        values:
        - Failed
      params:
      - name: ssh-credentials-secret
        value: ssh-credentials-$(context.pipelineRun.name)
      taskSpec:
        params:
        - name: ssh-credentials-secret
          type: string
          description: Name of the Secret containing SSH credentials (id_rsa, host, username).
        volumes:
        - name: ssh-credentials-volume
          secret:
            secretName: $(params.ssh-credentials-secret)
        steps:
        - name: collect-logs
          image: quay.io/aap-ci/tekton-catalog/task-runner/ansible:0.1@sha256:3bad16a6d1cc2c419cf7b7de6229ef7ccdc6212ef106d9d34e315b2ebd3c9ed9
          volumeMounts:
          - name: ssh-credentials-volume
            mountPath: /credentials/ssh
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_KEY=/tmp/id_rsa
            cp /credentials/ssh/id_rsa "${SSH_KEY}"
            chmod 600 "${SSH_KEY}"

            SSH_HOST=$(cat /credentials/ssh/host 2>/dev/null || echo "")
            SSH_USER=$(cat /credentials/ssh/username 2>/dev/null || echo "ec2-user")

            if [ -z "${SSH_HOST}" ]; then
              echo "No SSH host found in secret — cluster was not provisioned"
              exit 0
            fi

            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30)

            echo "=== Collecting AO service logs from ${SSH_HOST} ==="
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              KUBECONFIG_PATH=\$(ls -1 \$HOME/aap-dev/.tmp/*.kubeconfig 2>/dev/null | head -1)
              if [ -z \$KUBECONFIG_PATH ]; then
                echo 'KUBECONFIG not found — AO was not deployed'
                exit 0
              fi
              export KUBECONFIG=\"\${KUBECONFIG_PATH}\"

              echo '=== Pod status ==='
              kubectl get pods -o wide 2>&1 || true
              echo ''

              echo '=== Recent events ==='
              kubectl get events --sort-by=.lastTimestamp 2>&1 || true
              echo ''

              for pod in \$(kubectl get pods -o name 2>/dev/null); do
                pod_name=\"\${pod#pod/}\"
                echo \"=== Logs: \${pod_name} ===\"
                kubectl logs \"\${pod}\" --all-containers --ignore-errors 2>&1 || true
                echo ''
                echo \"=== Init container logs: \${pod_name} ===\"
                for init in \$(kubectl get pod \"\${pod_name}\" -o jsonpath='{.spec.initContainers[*].name}' 2>/dev/null); do
                  echo \"--- \${init} ---\"
                  kubectl logs \"\${pod_name}\" -c \"\${init}\" 2>&1 || true
                done
                echo ''
              done

              echo '=== Kernel OOM killer logs ==='
              sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process|out of memory|memory cgroup' || echo 'No OOM events found'
              echo ''

              echo '=== Kernel logs (last 200 lines) ==='
              sudo dmesg -T 2>/dev/null | tail -200 || echo 'dmesg not available'
              echo ''
            " || echo "SSH connection failed — VM may be unreachable or already deprovisioned"
    - name: deprovision-kind-cluster
      taskRef:
        resolver: git
        params:
        - name: url
          value: https://github.com/konflux-ci/tekton-integration-catalog.git
        - name: revision
          value: 4b4551ce2dcfaed44d79c228c40c7e3de3c68657
        - name: pathInRepo
          value: tasks/mapt-oci/kind-aws-spot/deprovision/0.1/kind-aws-deprovision.yaml
      params:
      - name: secret-aws-credentials
        value: $(params.mapt-aws-secret)
      - name: id
        value: $(context.pipelineRun.name)
      - name: ownerName
        value: $(context.pipelineRun.name)
      - name: cluster-access-secret
        value: kubeconfig-$(context.pipelineRun.name)
      - name: oci-container
        value: $(params.oci-container-repo):$(context.pipelineRun.name)-deprovision-kind-cluster
      - name: oci-credentials
        value: $(params.oci-secret)
      - name: debug
        value: $(params.mapt-deprovision-debug)
      - name: force-destroy
        value: $(params.mapt-deprovision-force-destroy)
  taskRunTemplate:
    serviceAccountName: konflux-integration-runner

