---
# Thin stub: the ep-api-tests bundle pipeline.
#
# This PR's Execution Plane head is what gets deployed and tested (the
# pipeline source repo provides ep-revision); AO comes from the pipeline's
# ao-revision default (feat/ANSTRAT-1803 — must include EP script dispatch
# and credential.resolve until those land on devel). The ao-operator-revision
# pin drops when the prebuilt operator bundle honors ENABLE_EXECUTION_PLANE
# (automation-orchestrator-operator#1573).
#
# Replaces the ~1,000-line inline PipelineRun. The pipeline bundle must
# publish first (aap-konflux-pipelines#4747); the digest below points at a
# placeholder until then — bump it when the bundle is out.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: "{{source_url}}?rev={{revision}}"
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && target_branch == "devel"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ansible-automation-orchestrator-devel
    appstudio.openshift.io/component: ansible-automation-orchestrator-execution-plane-devel
    pipelines.appstudio.openshift.io/type: test
  name: automation-orchestrator-ep-e2e-devel-pull-request
  namespace: nexus-tenant
spec:
  timeouts:
    pipeline: "6h"
    tasks: "5h"
    finally: "1h"
  params:
    - name: git-url
      value: https://github.com/syntara-orchestration/syntara-execution-plane
    - name: pipeline-github-org
      value: "{{repo_owner}}"
    - name: pipeline-github-repo
      value: "{{repo_name}}"
    - name: pipeline-github-pr-revision
      # VALIDATION PIN: deploy the EP half of the AAP-99749 cancellation work
      # (#174's branch) rather than this throwaway PR's head, so the run
      # co-tests the git-core-free syntara image against the EP revision
      # that pairs with syntara#1214.
      value: AAP-99749
    - name: pipeline-github-pr-number
      value: '174'
    - name: ao-git-url
      value: https://github.com/syntara-orchestration/syntara.git
    - name: ao-revision
      value: feat/ANSTRAT-1803
    # VALIDATION PIN (ansible/aap-dev#1184, throwaway PR): build the syntara
    # image from the aap-dev branch that drops git-core, proving the image
    # builds from source with the PyPI execution-plane-client and the full
    # AO + EP stack deploys without git. Drop once #1184 merges.
    - name: aap-dev-revision
      value: goneri/remove-git-core-syntara-image
  pipelineRef:
    resolver: bundles
    params:
      - name: name
        value: ep-api-tests
      - name: bundle
        value: quay.io/aap-ci/tekton-catalog/pipeline/test/ep-api-tests:0.1@sha256:3f7529d4a5bf90ac3c20bb06a20d7ce5c8f4f0b1d23c5043e20a2eb6d628225d
      - name: kind
        value: pipeline
      - name: secret
        value: quay-aap-ci-viewer
  taskRunTemplate:
    serviceAccountName: konflux-integration-runner
