# Target-cluster RBAC for the Execution Plane dispatcher ServiceAccount.
# Applied by tools/deploy_kind_execution_target.py, the CI kind job, and
# tools/ci/konflux-prepare-execution-plane.sh.
# Namespaced Role: vanilla-k8s transport (Jobs, ConfigMaps, one attempt-scoped
# runtime TLS Secret, list Pods, pods/portforward, NetworkPolicies). ClusterRole:
# Resource Monitor namespace GET. Do not add Pod create, Secret read/list, or logs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: execution-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syntara-dispatcher
  namespace: execution-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: syntara-node-dispatcher
  namespace: execution-plane
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: syntara-node-dispatcher
  namespace: execution-plane
subjects:
  - kind: ServiceAccount
    name: syntara-dispatcher
    namespace: execution-plane
roleRef:
  kind: Role
  name: syntara-node-dispatcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: syntara-resource-monitor
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: syntara-resource-monitor
subjects:
  - kind: ServiceAccount
    name: syntara-dispatcher
    namespace: execution-plane
roleRef:
  kind: ClusterRole
  name: syntara-resource-monitor
  apiGroup: rbac.authorization.k8s.io
