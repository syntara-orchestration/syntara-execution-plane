openapi: 3.1.0
info:
  title: Execution Plane API
  description: Command submission and client-scoped execution resources. No command
    history is retained.
  version: 1.0.0
paths:
  /v1/capabilities:
    get:
      summary: Capabilities
      operationId: capabilities_v1_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesRead'
      security:
      - HTTPBearer: []
  /v1/commands:
    post:
      summary: Receive Command
      operationId: receive_command_v1_commands_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportReceipt'
        '422':
          description: Invalid or unsupported command
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageEnvelope'
  /v1/work-items:
    get:
      summary: Work Items
      operationId: work_items_v1_work_items_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          exclusiveMinimum: 0
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^-?[a-z][a-z0-9_]*$
          description: Sort field; prefix with '-' for descending order.
          default: -created_at
          title: Sort
        description: Sort field; prefix with '-' for descending order.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Total
      - name: id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by id
          title: Id
        description: Filter by id
      - name: execution_target_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by execution_target_id
          title: Execution Target Id
        description: Filter by execution_target_id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status
          title: Status
        description: Filter by status
      - name: created_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by created_at
          title: Created At
        description: Filter by created_at
      - name: claimed_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by claimed_at
          title: Claimed At
        description: Filter by claimed_at
      - name: completed_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by completed_at
          title: Completed At
        description: Filter by completed_at
      - name: resource_cleanup_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by resource_cleanup_status
          title: Resource Cleanup Status
        description: Filter by resource_cleanup_status
      - name: resource_cleanup_error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by resource_cleanup_error
          title: Resource Cleanup Error
        description: Filter by resource_cleanup_error
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemListResponse'
        '422':
          description: Invalid query parameters or cursor
  /v1/work-items/{resource_id}:
    get:
      summary: Work Item
      operationId: work_item_v1_work_items__resource_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/clusters:
    get:
      summary: Clusters
      operationId: clusters_v1_clusters_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          exclusiveMinimum: 0
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^-?[a-z][a-z0-9_]*$
          description: Sort field; prefix with '-' for descending order.
          default: created_at
          title: Sort
        description: Sort field; prefix with '-' for descending order.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Total
      - name: id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by id
          title: Id
        description: Filter by id
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by name
          title: Name
        description: Filter by name
      - name: endpoint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by endpoint
          title: Endpoint
        description: Filter by endpoint
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status
          title: Status
        description: Filter by status
      - name: status_message
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status_message
          title: Status Message
        description: Filter by status_message
      - name: enabled
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by enabled
          title: Enabled
        description: Filter by enabled
      - name: is_default
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by is_default
          title: Is Default
        description: Filter by is_default
      - name: created_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by created_at
          title: Created At
        description: Filter by created_at
      - name: updated_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by updated_at
          title: Updated At
        description: Filter by updated_at
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterListResponse'
        '422':
          description: Invalid query parameters or cursor
  /v1/clusters/{resource_id}:
    get:
      summary: Cluster
      operationId: cluster_v1_clusters__resource_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/execution-targets:
    get:
      summary: Targets
      operationId: targets_v1_execution_targets_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          exclusiveMinimum: 0
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^-?[a-z][a-z0-9_]*$
          description: Sort field; prefix with '-' for descending order.
          default: created_at
          title: Sort
        description: Sort field; prefix with '-' for descending order.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Total
      - name: id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by id
          title: Id
        description: Filter by id
      - name: cluster_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by cluster_id
          title: Cluster Id
        description: Filter by cluster_id
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by name
          title: Name
        description: Filter by name
      - name: backend_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by backend_type
          title: Backend Type
        description: Filter by backend_type
      - name: endpoint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by endpoint
          title: Endpoint
        description: Filter by endpoint
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status
          title: Status
        description: Filter by status
      - name: enabled
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by enabled
          title: Enabled
        description: Filter by enabled
      - name: is_default
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by is_default
          title: Is Default
        description: Filter by is_default
      - name: status_message
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status_message
          title: Status Message
        description: Filter by status_message
      - name: created_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by created_at
          title: Created At
        description: Filter by created_at
      - name: last_ran_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by last_ran_at
          title: Last Ran At
        description: Filter by last_ran_at
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTargetListResponse'
        '422':
          description: Invalid query parameters or cursor
  /v1/execution-targets/{resource_id}:
    get:
      summary: Target
      operationId: target_v1_execution_targets__resource_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTargetRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BackendType:
      type: string
      enum:
      - kubernetes
      - openshell
      title: BackendType
      description: Supported execution target backends.
    CapabilitiesRead:
      properties:
        protocol_revision:
          type: integer
          const: 1
          title: Protocol Revision
          default: 1
        commands:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Commands
      additionalProperties: false
      type: object
      required:
      - commands
      title: CapabilitiesRead
      description: Command revisions installed by this participant.
    ClusterListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ClusterRead'
          type: array
          title: Resources
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        prev:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      required:
      - resources
      title: ClusterListResponse
      description: Paginated list response for clusters.
    ClusterRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Cluster unique identifier
        name:
          type: string
          title: Name
          description: Cluster name
        endpoint:
          type: string
          title: Endpoint
          description: Cluster API endpoint URL
        status:
          type: string
          title: Status
          description: Cluster lifecycle status
        status_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Message
          description: Human-readable status message or error details
        enabled:
          type: boolean
          title: Enabled
          description: Whether the cluster is enabled for use
        is_default:
          type: boolean
          title: Is Default
          description: Whether this is the default cluster
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Key-value labels for the cluster
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
      type: object
      required:
      - id
      - name
      - endpoint
      - status
      - enabled
      - is_default
      - labels
      - created_at
      - updated_at
      title: ClusterRead
      description: Provisioned cluster state, keyed by the actual cluster UUID.
    CredentialResolveCommandResult:
      properties:
        command_type:
          type: string
          const: credential.resolve
          title: Command Type
          default: credential.resolve
        command_revision:
          type: integer
          const: 1
          title: Command Revision
          default: 1
        credential:
          type: string
          maxLength: 65536
          minLength: 1
          title: Credential
      additionalProperties: false
      type: object
      required:
      - credential
      title: CredentialResolveCommandResult
      description: Typed result returned for a credential-resolution command.
    CredentialResolveWorkloadCommandResult:
      properties:
        command_type:
          type: string
          const: credential.resolve.workload
          title: Command Type
          default: credential.resolve.workload
        command_revision:
          type: integer
          const: 1
          title: Command Revision
          default: 1
        credential:
          additionalProperties:
            type: string
            maxLength: 8192
            minLength: 1
          propertyNames:
            maxLength: 128
            minLength: 1
          type: object
          title: Credential
      additionalProperties: false
      type: object
      required:
      - credential
      title: CredentialResolveWorkloadCommandResult
      description: Typed result returned for a workload credential-resolution command.
    ExecutionTargetListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ExecutionTargetRead'
          type: array
          title: Resources
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        prev:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      required:
      - resources
      title: ExecutionTargetListResponse
      description: Paginated list response for execution targets.
    ExecutionTargetRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Execution target unique identifier
        cluster_id:
          type: string
          format: uuid
          title: Cluster Id
          description: Parent cluster identifier
        name:
          type: string
          title: Name
          description: Execution target name
        backend_type:
          $ref: '#/components/schemas/BackendType'
          description: Backend execution platform type
        endpoint:
          type: string
          title: Endpoint
          description: Execution target API endpoint URL
        placement:
          oneOf:
          - $ref: '#/components/schemas/KubernetesPlacement'
          - $ref: '#/components/schemas/RHELPlacement'
          title: Placement
          description: Platform-specific placement configuration
          discriminator:
            propertyName: type
            mapping:
              kubernetes: '#/components/schemas/KubernetesPlacement'
              rhel: '#/components/schemas/RHELPlacement'
        status:
          $ref: '#/components/schemas/TargetStatus'
          description: Execution target lifecycle status
        enabled:
          type: boolean
          title: Enabled
          description: Whether the target is enabled for use
        is_default:
          type: boolean
          title: Is Default
          description: Whether this is the default target for the cluster
        status_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Message
          description: Human-readable status message or error details
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Key-value labels for the target
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        last_ran_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ran At
          description: Last execution timestamp
      type: object
      required:
      - id
      - cluster_id
      - name
      - backend_type
      - endpoint
      - placement
      - status
      - enabled
      - is_default
      - labels
      - created_at
      title: ExecutionTargetRead
      description: Safe execution-target representation without management credentials.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KubernetesPlacement:
      properties:
        type:
          type: string
          const: kubernetes
          title: Type
          default: kubernetes
        namespace:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: Namespace
          description: Kubernetes namespace reserved for execution workloads
        node_selectors:
          items:
            type: string
          type: array
          title: Node Selectors
        tolerations:
          items:
            type: string
          type: array
          title: Tolerations
      type: object
      required:
      - namespace
      title: KubernetesPlacement
      description: Metadata required to place workers on Kubernetes.
    RHELPlacement:
      properties:
        type:
          type: string
          const: rhel
          title: Type
          default: rhel
      type: object
      title: RHELPlacement
      description: Placeholder for RHEL-specific execution-target metadata.
    ResourceReference:
      properties:
        kind:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Kind
        resource_id:
          type: string
          format: uuid
          title: Resource Id
        resource_key:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Resource Key
        revision:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Revision
      additionalProperties: false
      type: object
      required:
      - kind
      - resource_id
      title: ResourceReference
      description: Safe reference from a command to a participant-owned resource.
    TargetHealthCommandResult:
      properties:
        command_type:
          type: string
          const: execution_target.health
          title: Command Type
          default: execution_target.health
        command_revision:
          type: integer
          const: 1
          title: Command Revision
          default: 1
        healthy:
          type: boolean
          title: Healthy
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        skipped:
          type: boolean
          title: Skipped
          default: false
      additionalProperties: false
      type: object
      required:
      - healthy
      title: TargetHealthCommandResult
      description: Typed result returned for an execution-target health command.
    TargetStatus:
      type: string
      enum:
      - registering
      - validating
      - bootstrapping
      - active
      - degraded
      - draining
      - failed
      title: TargetStatus
      description: Lifecycle states of an execution target.
    TransportReceipt:
      properties:
        received:
          type: boolean
          const: true
          title: Received
          default: true
        message_id:
          type: string
          format: uuid
          title: Message Id
        resource:
          anyOf:
          - $ref: '#/components/schemas/ResourceReference'
          - type: 'null'
        result:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CredentialResolveCommandResult'
            - $ref: '#/components/schemas/CredentialResolveWorkloadCommandResult'
            - $ref: '#/components/schemas/TargetHealthCommandResult'
            discriminator:
              propertyName: command_type
              mapping:
                credential.resolve: '#/components/schemas/CredentialResolveCommandResult'
                credential.resolve.workload: '#/components/schemas/CredentialResolveWorkloadCommandResult'
                execution_target.health: '#/components/schemas/TargetHealthCommandResult'
          - type: 'null'
          title: Result
      additionalProperties: false
      type: object
      required:
      - message_id
      title: TransportReceipt
      description: Receipt of a handled request, without a persisted command record.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkItemListResponse:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/WorkItemRead'
          type: array
          title: Resources
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        prev:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      required:
      - resources
      title: WorkItemListResponse
      description: Paginated list response for work items.
    WorkItemRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Work item unique identifier
        status:
          $ref: '#/components/schemas/WorkItemStatus'
          description: Work item lifecycle status
        cancellation_requested:
          type: boolean
          title: Cancellation Requested
          description: 'Whether cancellation intent has been persisted. A true value
            does not confirm that execution has stopped: status remains dispatched
            or running until an outcome is known. A result may win the cancellation
            race. This flag remains true after completion and is also set by deletion.'
          default: false
        deletion_requested:
          type: boolean
          title: Deletion Requested
          description: Whether deletion intent has been persisted. Always implies
            cancellation_requested=true. Active work is cancelled asynchronously,
            and the record remains readable until resource cleanup is confirmed and
            the record is removed. This flag does not change an existing terminal
            outcome or confirm that deletion has completed.
          default: false
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
          description: Work execution result payload
        result_omitted:
          type: boolean
          title: Result Omitted
          description: Whether result was omitted due to size
          default: false
        result_size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Result Size Bytes
          description: Size of the result in bytes
        created_at:
          type: string
