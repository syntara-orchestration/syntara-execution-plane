[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execution-plane-client"
version = "0.1.0"
description = "Shared execution-plane command contracts and handler registry"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15,<3.16"
dependencies = ["pydantic>=2.0.0"]

[tool.hatch.build.targets.wheel]
include = ["/*.py", "/py.typed", "/commands/**"]

[tool.hatch.build.targets.wheel.sources]
"" = "execution_plane_client"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.sdist]
include = ["/*.py", "/py.typed", "/commands/**", "/pyproject.toml", "/README.md", "/LICENSE"]
