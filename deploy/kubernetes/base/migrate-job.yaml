apiVersion: batch/v1
kind: Job
metadata:
  name: execution-plane-migrate
  labels:
    app.kubernetes.io/name: execution-plane
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-plane
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/syntara-orchestration/execution-plane:latest
          command: [alembic, -c, alembic.ini, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: execution-plane-db
                  key: migrator-url
