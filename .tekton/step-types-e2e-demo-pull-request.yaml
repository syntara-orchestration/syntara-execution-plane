---
# Lightweight SDK-image e2e, running from this repository.
#
# Why it lives here: syntara-step-types is not enabled in Konflux yet (no
# Pipelines as Code Repository CR), so a PipelineRun there cannot trigger.
# The step-types-e2e pipeline bundle is not published until
# ansible-automation-platform/aap-konflux-pipelines#4950 merges. This
# PipelineRun embeds the whole pipeline spec inline, including the
# deploy-ao-using-aap-dev task itself as a taskSpec. (The task cannot be
# resolved from the #4950 branch with the git resolver: ansible-automation-
# platform/aap-konflux-pipelines is private and the cluster resolver has no
# credentials for it; and the published task bundle predates the
# step-types-* params. The taskSpec below is the task exactly as it stands
# on the aap-konflux-pipelines#4950 branch.)
#
#   this PR's Execution Plane  (ep-revision = {{revision}})
#   + AO feat/ANSTRAT-1803    (script-node dispatch)
#   + aap-dev goneri/step-types-node-image  (ansible/aap-dev#1161:
#        ensure-step-types-from-src + the script-node image built from a
#        staged syntara-step-types checkout)
#   + syntara-step-types goneri/e2e-dispatch  (syntara-orchestration/
#        syntara-step-types#20: the dispatch e2e suite the run task executes)
#   + deploy-ao-using-aap-dev taskSpec    (the aap-konflux-pipelines#4950
#        branch: step-types-* params and the clone-step-types step)
#   -> deploy on a Kind cluster (AWS spot VM) and run ONE lightweight e2e
#      test through konflux-run-e2e.sh (E2E_PYTEST_TARGET): the script-bash
#      SDK image's example workload dispatched through AO and the Execution
#      Plane, business result asserted ("hello from bash").
#
# The CEL gate fires only when this file itself changes, so ordinary EP PRs
# do not provision a VM: touch this file (e.g. add a trailing comment) to
# run the e2e.
#
# When #4950 merges, the bundle is published and syntara-step-types is
# onboarded to Konflux, this file collapses to the usual thin stub (see
# automation-orchestrator-ep-e2e-devel-pull-request.yaml) and moves to the
# syntara-step-types repository — running the full suite there.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: '{{source_url}}?rev={{revision}}'
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
    pipelinesascode.tekton.dev/max-keep-runs: '2'
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "devel"
      && ".tekton/step-types-e2e-demo-pull-request.yaml".pathChanged()
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ansible-automation-orchestrator-devel
    appstudio.openshift.io/component: ansible-automation-orchestrator-execution-plane-devel
    pipelines.appstudio.openshift.io/type: test
  name: step-types-e2e-demo-pull-request
  namespace: nexus-tenant
spec:
  timeouts:
    pipeline: 6h
    tasks: 5h
    finally: 1h
  params:
  - name: git-url
    value: https://github.com/syntara-orchestration/syntara-step-types.git
  - name: pipeline-github-org
    value: syntara-orchestration
  - name: pipeline-github-repo
    value: syntara-step-types
  - name: pipeline-github-pr-revision
    value: goneri/e2e-dispatch
  - name: pipeline-github-pr-number
    value: '20'
  - name: aap-dev-revision
    value: goneri/step-types-node-image
  # AO: the line that carries EP script dispatch.
  - name: ao-revision
    value: feat/ANSTRAT-1803
  - name: ep-git-url
    value: '{{source_url}}'
  - name: ep-revision
    value: '{{revision}}'
  - name: ao-operator-git-url
    value: https://github.com/automation-nexus/automation-orchestrator-operator.git
  - name: ao-operator-revision
    value: feat/ANSTRAT-1803
  pipelineSpec:
    description: |-
      Validate syntara-step-types changes by dispatching the plugin example
      workloads through AO and an operator-managed Execution Plane.

      Same skeleton as ep-api-tests with the revision roles adapted: the
      pipeline source repository (the syntara-step-types PR) provides the
      script-node workload image under test — git-url /
      pipeline-github-pr-revision / pipeline-github-pr-number feed the
      deploy-ao task's step-types-git-url / step-types-revision /
      step-types-pr-number params directly, and aap-dev's
      ensure-step-types-from-src builds the script-node image from that
      checkout — while AO and the Execution Plane come from the ao-revision
      and ep-revision params. The run task executes
      tools/konflux-run-e2e.sh from the step-types checkout deploy-ao
      cloned to ~/syntara-step-types (dispatches each plugin's example
      workload through the AO API and asserts the business results).

      No prepare task: aap-dev's after-deploy hooks
      (configure-ao-sdk-script-step, configure-ep-execution-target) wire
      the script-node image and register the Kind cluster as the dispatch
      target.
    params:
    - name: git-url
      type: string
      description: Git URL of the source repository (handles both origin and fork PRs). Provided by Pipelines
        as Code.
    - name: pipeline-github-org
      type: string
      description: The GitHub organization for the pipeline (base repo).
    - name: pipeline-github-repo
      type: string
      description: The GitHub repository for the pipeline (base repo).
    - name: pipeline-github-pr-revision
      type: string
      description: The GitHub repository PR branch name. Used as the nexus-combined revision to check
        out.
    - name: pipeline-github-pr-number
      type: string
      description: The GitHub PR number of the GitHub pull request that triggered the pipeline run.
    - name: oci-container-repo
      type: string
      description: The OCI container repository used to store pipeline run artifacts (mapt provision/deprovision).
      default: quay.io/aap-ci/pipeline-artifacts/$(params.pipeline-github-org)/$(params.pipeline-github-repo)
    - name: oci-ta-container
      type: string
      description: OCI registry base URI for trusted artifacts (test results).
      default: quay.io/aap-ci/pipeline-artifacts/$(params.pipeline-github-org)/$(params.pipeline-github-repo)
    - name: aap-dev-git-url
      description: The aap-dev github repository url.
      default: https://github.com/ansible/aap-dev.git
    - name: aap-dev-revision
      description: The aap-dev github repository branch.
      default: main
    - name: ao-revision
      type: string
      description: Branch, tag, or SHA of syntara-orchestration/syntara to deploy and test against. Must
        include EP script dispatch and credential.resolve — feat/ANSTRAT-1803 until those land on devel.
      default: feat/ANSTRAT-1803
    - name: ep-git-url
      type: string
      description: HTTPS URL of the syntara-execution-plane repository providing the Execution Plane.
      default: https://github.com/syntara-orchestration/syntara-execution-plane.git
    - name: ep-revision
      type: string
      description: Branch, tag, or SHA of syntara-execution-plane to deploy as the operator-managed Execution
        Plane. devel once the EP lands on its mainline; until then pin the branch the AO revision needs.
      default: devel
    - name: ao-pr-number
      type: string
      description: Optional syntara PR number so deploy-ao can fetch a fork head SHA.
      default: ''
    - name: ao-operator-git-url
      type: string
      description: HTTPS URL of the automation-orchestrator-operator repository. Only used when ao-operator-revision
        is set.
      default: ''
    - name: ao-operator-revision
      type: string
      description: Branch, tag, or SHA of automation-orchestrator-operator to build the operator manager
        from, instead of the prebuilt bundle. Empty (default) uses the prebuilt bundle. Needed while the
        prebuilt devel bundle ignores ENABLE_EXECUTION_PLANE (automation-orchestrator-operator#1573).
      default: ''
    - name: ao-operator-pr-number
      type: string
      description: Optional operator PR number so the clone can fetch a fork head SHA.
      default: ''
    - name: ao-operator-github-app-secret
      type: string
      description: GitHub App secret for cloning automation-orchestrator-operator (automation-nexus org).
        Only used when ao-operator-revision is set.
      default: orchestrator-ci-for-konflux-gh-app-nexus-org
    - name: oci-secret
      type: string
      description: The OCI secret to access the OCI container repository to store pipeline run artifacts.
      default: quay-aap-ci-pipeline-artifacts-publisher
    - name: mapt-aws-secret
      type: string
      description: The name of the secret holding the AWS credentials to provision/deprovision the kind
        cluster.
      default: aws-mapt-credentials
    - name: registry-credentials-secret
      type: string
      description: The name of the secret containing registry credentials (quay.io, registry.redhat.io)
        for the remote AO deployment.
      default: aap-registry-credentials
    - name: bundle-secret-name
      type: string
      description: Secret name for authenticating to private Tekton task bundles (quay.io/aap-ci/tekton-catalog).
      default: quay-aap-ci-viewer
    - name: aap-dev-git-auth-secret
      type: string
      description: The aap-dev github authentication secret used to clone the repository.
      default: github-aap-pde-ci-bot-credentials-ansible
    - name: ao-github-app-secret
      type: string
      description: Name of the Kubernetes Secret (produced by the orchestrator-ci-for-konflux-gh-app ExternalSecret)
        holding GitHub App credentials for cloning syntara-orchestration/syntara. Passed to the deploy-ao-using-aap-dev
        task.
      default: orchestrator-ci-for-konflux-gh-app
    - name: ao-backend-replicas
      type: string
      description: Number of AO backend pod replicas. Passed to the deploy-ao-using-aap-dev task, which
        forwards it to aap-dev as AO_BACKEND_REPLICAS so the AutomationOrchestrator CR is rendered with
        spec.backend.replicas already set. Leave empty to fall back to the operator's own default (2).
      default: '4'
    - name: external-services-deploy-key-secret
      type: string
      description: Name of the Kubernetes Secret holding the SSH deploy key for the ansible-automation-platform/external-services
        private dependency. Must have a key "ssh-privatekey".
      default: external-services-deploy-key-secret
    - name: env-variables-secret-name
      type: string
      description: Name of a Kubernetes Secret whose keys are exported as environment variables in the
        run-tests step.
      default: nexus-tests-env-variables
    - name: oci-ta-credentials-secret
      type: string
      description: Name of the Kubernetes Secret containing OCI registry credentials for trusted artifacts
        (used by run-ao-api-tests and fetch-test-results).
      default: aap-ci-quay
    - name: ao-repo-git-auth-secret
      type: string
      description: The AO GitHub authentication secret used to post PR comments.
      default: orchestrator-ci-for-konflux-gh-app
    - name: mapt-provision-tags
      type: string
      description: The comma-separated AWS resource tags for mapt provisioned resources.
      default: github_repo=$(params.pipeline-github-org)/$(params.pipeline-github-repo),managed_by=konflux,github_pr_number=$(params.pipeline-github-pr-number)
    - name: mapt-provision-arch
      type: string
      description: The architecture for the AWS instance (x86_64 or arm64).
      default: ''
    - name: mapt-provision-cpus
      type: string
      description: The number of vCPUs for the mapt Kind host VM.
      default: ''
    - name: mapt-provision-memory
      type: string
      description: The memory in GiB for the mapt Kind host VM.
      default: ''
    - name: mapt-provision-compute-sizes
      type: string
      description: The compute sizes for the mapt Kind host VM (comma-separated). If set, overrides arch/cpus/memory
        per mapt task.
      default: m6a.4xlarge,m6i.4xlarge,m5a.4xlarge,m5.4xlarge
    - name: mapt-provision-nested-virt
      type: string
      description: Enable nested virtualization for Kind on the VM.
      default: 'false'
    - name: mapt-provision-spot
      type: string
      description: Use EC2 spot instances for the mapt Kind host.
      default: 'false'
    - name: mapt-provision-spot-increase-rate
      type: string
      description: The percentage added to spot bid to improve allocation chances.
      default: '80'
    - name: mapt-provision-spot-eviction-tolerance
      type: string
      description: The spot eviction tolerance (lowest, low, medium, high, highest).
      default: lowest
    - name: mapt-provision-kind-k8s-version
      type: string
      description: The Kubernetes version for the Kind cluster (mapt version param).
      default: v1.32
    - name: mapt-provision-debug
      type: string
      description: Verbose mapt provision logs (may expose sensitive data).
      default: 'false'
    - name: mapt-deprovision-debug
      type: string
      description: Verbose mapt deprovision logs (may expose sensitive data).
      default: 'false'
    - name: mapt-deprovision-force-destroy
      type: string
      description: Force destroy even if mapt reports a provisioning lock.
      default: 'true'
    - name: mapt-provision-extra-port-mappings
      type: string
      description: |
        Additional port mappings for the Kind cluster. Port 30001 is used to expose the AO backend externally.
      default: '''[{\"containerPort\":30001,\"hostPort\":30001,\"protocol\":\"TCP\"}]'''
    tasks:
    - name: provision-kind-cluster
      taskRef:
        resolver: git
        params:
        - name: url
          value: https://github.com/konflux-ci/tekton-integration-catalog.git
        - name: revision
          value: 4b4551ce2dcfaed44d79c228c40c7e3de3c68657
        - name: pathInRepo
          value: tasks/mapt-oci/kind-aws-spot/provision/0.2/kind-aws-provision.yaml
      params:
      - name: secret-aws-credentials
        value: $(params.mapt-aws-secret)
      - name: cluster-access-secret-name
        value: kubeconfig-$(context.pipelineRun.name)
      - name: id
        value: $(context.pipelineRun.name)
      - name: ownerKind
        value: PipelineRun
      - name: ownerName
        value: $(context.pipelineRun.name)
      - name: ownerUid
        value: $(context.pipelineRun.uid)
      - name: arch
        value: $(params.mapt-provision-arch)
      - name: cpus
        value: $(params.mapt-provision-cpus)
      - name: memory
        value: $(params.mapt-provision-memory)
      - name: compute-sizes
        value: $(params.mapt-provision-compute-sizes)
      - name: nested-virt
        value: $(params.mapt-provision-nested-virt)
      - name: spot
        value: $(params.mapt-provision-spot)
      - name: spot-increase-rate
        value: $(params.mapt-provision-spot-increase-rate)
      - name: spot-eviction-tolerance
        value: $(params.mapt-provision-spot-eviction-tolerance)
      - name: version
        value: $(params.mapt-provision-kind-k8s-version)
      - name: tags
        value: $(params.mapt-provision-tags)
      - name: debug
        value: $(params.mapt-provision-debug)
      - name: oci-ref
        value: $(params.oci-container-repo):$(context.pipelineRun.name)-provision-kind-cluster
      - name: oci-credentials
        value: $(params.oci-secret)
      - name: ssh-credentials-secret-name
        value: ssh-credentials-$(context.pipelineRun.name)
      - name: extra-port-mappings
        value: $(params.mapt-provision-extra-port-mappings)
    - name: deploy-ao
      runAfter:
      - provision-kind-cluster
      params:
      - name: cluster-access-secret
        value: kubeconfig-$(context.pipelineRun.name)
      - name: ssh-credentials-secret
        value: ssh-credentials-$(context.pipelineRun.name)
      - name: registry-credentials-secret
        value: $(params.registry-credentials-secret)
      - name: aap-dev-git-url
        value: $(params.aap-dev-git-url)
      - name: aap-dev-revision
        value: $(params.aap-dev-revision)
      - name: aap-dev-git-auth-secret
        value: $(params.aap-dev-git-auth-secret)
      - name: ao-github-app-secret
        value: $(params.ao-github-app-secret)
      - name: ao-revision
        value: $(params.ao-revision)
      - name: ao-pr-number
        value: $(params.ao-pr-number)
      - name: ao-backend-replicas
        value: $(params.ao-backend-replicas)
      - name: ep-git-url
        value: $(params.ep-git-url)
      - name: ep-revision
        value: $(params.ep-revision)
      - name: ep-pr-number
        value: ''
      - name: step-types-git-url
        value: $(params.git-url)
      - name: step-types-revision
        value: $(params.pipeline-github-pr-revision)
      - name: step-types-pr-number
        value: $(params.pipeline-github-pr-number)
      - name: ao-operator-git-url
        value: $(params.ao-operator-git-url)
      - name: ao-operator-revision
        value: $(params.ao-operator-revision)
      - name: ao-operator-pr-number
        value: $(params.ao-operator-pr-number)
      - name: ao-operator-github-app-secret
        value: $(params.ao-operator-github-app-secret)
      taskSpec:
        description: |
          Deploy Automation Orchestrator (AO) on a remote Kind cluster via SSH using aap-dev.

          Clones aap-dev and syntara (at the specified revision) on the remote Kind VM,
          symlinks the AO backend and frontend sources into aap-dev, records them in
          src/sources.yaml (required for install-from-src after aap-dev#1023), then builds and deploys AO
          using the OLM operator mode (AO_OPERATOR=true with skaffold-ao-operator.yaml). When
          `ao-backend-replicas` is set, the backend is deployed at that size from the start via
          AO_BACKEND_REPLICAS. After deployment, configures resource limits and network settings,
          retrieves the admin password created by the operator, and exposes the backend externally
          via a Kubernetes NodePort service.

          Mirrors the e2e-ao-operator GitHub Actions workflow in syntara-orchestration/syntara.
        params:
        - name: cluster-access-secret
          type: string
          description: Name of the Kubernetes Secret containing the Kind cluster kubeconfig.
        - name: ssh-credentials-secret
          type: string
          description: Name of the Kubernetes Secret containing SSH credentials (host, user, id_rsa).
        - name: registry-credentials-secret
          type: string
          description: |
            Name of the Kubernetes Secret containing registry credentials used for podman login
            on the remote VM. Required keys: quay-username, quay-token, rh-registry-username,
            rh-registry-token.
        - name: aap-dev-git-url
          type: string
          description: HTTPS URL of the aap-dev repository (without credentials).
          default: https://github.com/ansible/aap-dev.git
        - name: aap-dev-revision
          type: string
          description: Branch or tag of aap-dev to clone on the remote VM.
          default: main
        - name: aap-dev-commit
          type: string
          description: |
            Optional commit SHA to check out after cloning aap-dev. When set, the repo is
            cloned at aap-dev-revision then pinned to this exact commit. Leave empty to
            use the branch tip.
          default: ''
        - name: aap-dev-git-auth-secret
          type: string
          description: |
            Name of the Kubernetes Secret used to clone aap-dev on the remote VM
            (kubernetes.io/basic-auth with username and password keys).
        - name: ao-revision
          type: string
          description: Branch, tag, or SHA of syntara to check out on the remote VM.
        - name: ao-pr-number
          type: string
          description: |
            GitHub PR number for syntara. Used to fetch the PR head ref so that
            fork PR head SHAs (which do not exist in the base repo) are available
            for checkout.
          default: ''
        - name: ao-operator-git-url
          type: string
          description: |
            HTTPS URL of the automation-orchestrator-operator repository. Required
            when ao-operator-revision is set; unused (and left empty) on the
            prebuilt-bundle path — no internal repository is baked in as a
            default.
          default: ''
        - name: ao-operator-revision
          type: string
          description: |
            Branch, tag, or SHA of automation-orchestrator-operator to build the
            operator manager from, instead of deploying the prebuilt bundle.
            Empty (default) uses the prebuilt AO_OPERATOR_BUNDLE_IMAGE — today's
            behavior, so existing consumers are unaffected.

            When set, the checkout is cloned to ~/automation-orchestrator-operator
            on the VM; aap-dev's ensure-ao-operator-from-src builds the manager
            image into the Kind registry and points the CSV at it. Needed while the
            prebuilt devel bundle ignores ENABLE_EXECUTION_PLANE
            (automation-orchestrator-operator#1573); the params stay afterwards for
            cross-repo co-testing.
          default: ''
        - name: ao-operator-pr-number
          type: string
          description: |
            GitHub PR number for automation-orchestrator-operator. Used to fetch
            the PR head ref so that fork PR head SHAs are available for checkout.
            Only used when ao-operator-revision is set.
          default: ''
        - name: ao-operator-github-app-secret
          type: string
          description: |
            GitHub App secret for cloning automation-orchestrator-operator
            (automation-nexus org). Only used when ao-operator-revision is set.
          default: orchestrator-ci-for-konflux-gh-app-nexus-org
        - name: enable-execution-plane
          type: string
          description: |
            Deploy the operator-managed Execution Plane alongside AO (passed to
            aap-dev as AO_EXECUTION_PLANE). Default false — today's behavior, so
            existing consumers are unaffected.

            When true and ep-revision is empty, aap-dev deploys the EP from the
            prebuilt quay.io/aap/ansible-automation-platform/automation-orchestrator-execution-plane-rhel9:devel
            image (ensure-ep-from-src no-ops without a staged checkout). When
            ep-revision is set, the EP is built from that source and this flag is
            implied true.
          default: 'false'
        - name: ep-git-url
          type: string
          description: |
            HTTPS URL of the syntara-execution-plane repository. Required when
            ep-revision is set; unused (and left empty) otherwise — no repository
            is baked in as a default. The default Execution Plane source is the
            prebuilt quay.io/aap image aap-dev deploys when no checkout is staged.
          default: ''
        - name: ep-revision
          type: string
          description: |
            Branch, tag, or SHA of syntara-execution-plane to deploy as the
            operator-managed Execution Plane. Empty (default) deploys no Execution
            Plane — today's behavior, so existing consumers are unaffected.

            When set, the checkout is cloned to ~/syntara-execution-plane on the
            VM; aap-dev's ensure-ep-from-src overlays it into src/ and registers it
            in src/sources.yaml, and AO_EXECUTION_PLANE=true is passed to the
            aap-dev build and deploy so the operator deploys the EP API, worker,
            and migration Job.
          default: ''
        - name: ep-pr-number
          type: string
          description: |
            GitHub PR number for syntara-execution-plane. Used to fetch the PR head
            ref so that fork PR head SHAs are available for checkout. Only used
            when ep-revision is set.
          default: ''
        - name: step-types-git-url
          type: string
          description: |
            HTTPS URL of the syntara-step-types repository. When step-types-revision
            is set, the checkout is cloned to ~/syntara-step-types on the VM and
            aap-dev's ensure-step-types-from-src builds the script-node workload
            image from that checkout instead of the Execution Plane test fixture.
          default: ''
        - name: step-types-revision
          type: string
          description: |
            Branch, tag, or SHA of syntara-step-types providing the script-node
            workload image. Empty (default) keeps the EP fixture image, so
            existing consumers are unaffected.
          default: ''
        - name: step-types-pr-number
          type: string
          description: |
            GitHub PR number for syntara-step-types. Used to fetch the PR head
            ref so that fork PR head SHAs are available for checkout. Only used
            when step-types-revision is set.
          default: ''
        - name: ao-github-app-secret
          type: string
          description: |
            Name of the Kubernetes Secret (produced by the orchestrator-ci-for-konflux-gh-app
            ExternalSecret) holding GitHub App credentials for cloning syntara-orchestration/syntara.
            Required keys: orchestrator-ci-for-konflux-gh-app-id,
            orchestrator-ci-for-konflux-gh-app-install-id,
            orchestrator-ci-for-konflux-gh-app-private-key.
        - name: ao-backend-replicas
          type: string
          description: |
            Number of AO backend pod replicas. Passed to aap-dev as AO_BACKEND_REPLICAS, which
            declares spec.backend.replicas on the AutomationOrchestrator CR before it is rendered,
            so the backend is deployed at this size instead of being scaled up afterwards.
            Leave empty to fall back to the operator's own default (2); calling pipelines set the
            value they need for their test load.
          default: ''
        results:
        - name: ao-url
          description: External HTTPS URL of the deployed AO backend (host port 17455, mapped from Kind
            NodePort 30443).
        - name: ao-worker-url
          description: External HTTPS URL of the AO worker backend (same NodePort as ao-url; equivalent
            to the internal myao-backend:8000 used in CI).
        - name: ao-admin-password
          description: Bootstrap admin password initialized for the AO instance.
        - name: ao-host
          description: IP or hostname of the provisioned VM running the Kind cluster.
        volumes:
        - name: kubeconfig-volume
          secret:
