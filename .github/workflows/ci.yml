name: CI

on:
  pull_request:
  push:
    branches: [devel]

permissions:
  contents: read

jobs:
  lint-types-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy --strict src
      - run: make test-coverage TEST_ARGS='--ignore=tests/integration -m "not e2e"'
      - name: Upload unit coverage and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-coverage-unit
          path: |
            .coverage
            coverage.xml
            pytest-results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Regenerates requirements.txt / requirements-build.txt from uv.lock and fails
  # if the committed files differ. Cachi2/Hermeto pip prefetch needs these hashed
  # files; uv.lock is not enough.
  # To fix: run `make sync-requirements` and commit the result.
  requirements-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Create pybuild-deps cache directory
        run: mkdir -p /home/runner/.cache/pybuild-deps
      - run: make sync-requirements
      - name: Fail if requirements files have uncommitted changes
        run: |
          if ! git diff --exit-code -- requirements.txt requirements-build.txt; then
            echo "requirements files are out of sync. Run 'make sync-requirements' and commit the result."
            exit 1
          fi

  # Regenerates openapi.yaml and fails if the committed file differs.
  # To fix: run `uv run python tools/export_openapi.py` and commit the result.
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Create pybuild-deps cache directory
        run: mkdir -p /home/runner/.cache/pybuild-deps
      - run: uv sync --locked --all-groups
      - run: uv run python tools/export_openapi.py
      - name: Fail if openapi.yaml has uncommitted changes
        run: |
          if ! git diff --exit-code -- openapi.yaml; then
            echo "openapi.yaml is out of sync. Run 'uv run python tools/export_openapi.py' and commit the result."
            exit 1
          fi

  # Validate the container image builds on every change. Publishing happens
  # separately on version tags (see .github/workflows/release.yml); both share
  # the build via the container-build composite action.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/container-build

  # Runs the PostgreSQL persistence tests against a real database.
  # No Kubernetes cluster required.
  test-integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      EP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ep-setup

      - name: Run PostgreSQL persistence tests
        run: make test-coverage TEST_ARGS='tests/integration/postgres -v'

      - name: Upload PostgreSQL coverage and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-coverage-postgres
          path: |
            .coverage
            coverage.xml
            pytest-results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Runs the end-to-end dispatch test, which requires both PostgreSQL and a
  # live kind (Kubernetes-in-Docker) cluster. Kept as a separate job so the
  # postgres-only check above stays fast and clearly labelled.
  test-integration-postgres-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      EP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/execution_plane
      EP_CREDENTIAL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ep-setup

      # Stand up a throwaway kind cluster. The dispatcher ServiceAccount and RBAC
      # in deploy/kubernetes/execution-target/rbac.yaml grant the bearer token
      # the permissions the vanilla-k8s transport needs (pod list, portforward,
      # job CRUD).
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: integration-test

      - name: Provision dispatcher ServiceAccount and RBAC
        run: kubectl apply -f deploy/kubernetes/execution-target/rbac.yaml

      # The transport runs node pods with imagePullPolicy: IfNotPresent. Load the
      # image onto the kind node up front so the pod starts immediately rather
      # than racing a cold registry pull against the dispatch startup deadline.
      - name: Load the script node image onto the kind node
        run: |
          image="quay.io/ahetheri/syntara-node-script:migration-test"
          docker pull "$image"
          kind load docker-image "$image" --name integration-test

      - name: Export cluster coordinates for the test suite
        run: |
          set -euo pipefail
          endpoint="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          token="$(kubectl create token syntara-dispatcher -n execution-plane --duration=2h)"
          echo "::add-mask::${token}"
          ca_cert_pem="$(kubectl config view --minify --raw \
            -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d)"
          {
            echo "EP_IT_K8S_ENDPOINT=${endpoint}"
            echo "EP_IT_K8S_TOKEN=${token}"
            echo "EP_IT_K8S_NAMESPACE=execution-plane"
            printf "EP_IT_K8S_CA_CERT<<EOF\n%s\nEOF\n" "${ca_cert_pem}"
          } >> "$GITHUB_ENV"

      - name: Run cluster dispatch integration tests
        run: make test-coverage TEST_ARGS='tests/integration/kind -m integration -v --timeout=600'

      - name: Upload Kubernetes coverage and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-coverage-kind
          path: |
            .coverage
            coverage.xml
            pytest-results.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-logs
          path: |
            integration-test-logs/
          retention-days: 7
          if-no-files-found: ignore

  combine:
    name: Combine coverage and test results
    needs: [lint-types-unit, test-integration-postgres, test-integration-postgres-kind]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # Reporting needs development tools, not the editable EP packages.
      - run: uv sync --locked --only-group dev --no-build
      - name: Download coverage from each test job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ep-coverage-{unit,postgres,kind}
          path: coverage-artifacts
          merge-multiple: false
      - name: Require reports from all three test jobs
        run: |
          for suite in unit postgres kind; do
            test -s "coverage-artifacts/ep-coverage-${suite}/.coverage"
            test -s "coverage-artifacts/ep-coverage-${suite}/pytest-results.xml"
          done
      - run: make coverage-combine
        env:
          # Keep uv run from syncing (and building) the omitted EP packages.
          UV_NO_SYNC: "true"
      - name: Save PR number for the SonarCloud workflow
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s\n' "$PR_NUMBER" > pr-number.txt
      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-pr-number
          path: pr-number.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload combined reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ep-coverage-combined
          path: |
            coverage.xml
            pytest-results.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 30

  sonarcloud:
    name: SonarCloud Analysis
    needs: combine
    if: >-
      success()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Download combined coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ep-coverage-combined
          path: .
          if-no-files-found: error

      - name: Check coverage files
        run: |
          set -euo pipefail
          test -s coverage.xml
          test -s pytest-results.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          args: >-
            -Dsonar.projectKey=syntara-orchestration_syntara-execution-plane
            -Dsonar.organization=syntara-orchestration
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
