              fi
              if [ -n '${EP_PR_NUMBER}' ]; then
                git -C ~/syntara-execution-plane fetch origin refs/pull/${EP_PR_NUMBER}/head
              fi
              git -C ~/syntara-execution-plane checkout ${EP_REVISION}
            "
        - name: clone-step-types
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            if [ -z "${STEP_TYPES_REVISION}" ]; then
              echo "=== step-types-revision not set; skipping the syntara-step-types clone ==="
              exit 0
            fi

            SSH_HOST=$(cat /workspace/share/host)
