        steps:
        - name: setup-ssh
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            cp /credentials/ssh/id_rsa /workspace/share/id_rsa
            chmod 600 /workspace/share/id_rsa

            cat /credentials/ssh/host > /workspace/share/host
            SSH_USER=$(cat /credentials/ssh/username 2>/dev/null || echo "ec2-user")
            echo "${SSH_USER}" > /workspace/share/user

            echo "SSH host: $(cat /workspace/share/host)"
            echo "SSH user: ${SSH_USER}"
        - name: clone-aap-dev
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            AAP_DEV_GIT_USERNAME=$(cat /credentials/aap-dev-git/username)
            AAP_DEV_GIT_TOKEN=$(cat /credentials/aap-dev-git/password)

            echo "=== Installing required packages on remote VM ==="
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              sudo dnf install -y git make curl jq ansible-core python3-pip
            "

            echo "=== Cloning aap-dev at ${AAP_DEV_REVISION}${AAP_DEV_COMMIT:+ (pinned to ${AAP_DEV_COMMIT})} on remote VM ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              AAP_DEV_CLONE_URL=\"${AAP_DEV_GIT_URL/https:\/\//https://${AAP_DEV_GIT_USERNAME}:${AAP_DEV_GIT_TOKEN}@}\"
              if [ -d ~/aap-dev ]; then
                echo 'aap-dev already exists, skipping clone'
              else
                git clone --branch ${AAP_DEV_REVISION} \"\${AAP_DEV_CLONE_URL}\" ~/aap-dev
              fi
              if [ -n '${AAP_DEV_COMMIT}' ]; then
                echo 'Pinning aap-dev to commit ${AAP_DEV_COMMIT}'
                git -C ~/aap-dev checkout ${AAP_DEV_COMMIT}
              fi
            "
        - name: set-kernel-limits
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            echo "=== Setting inotify, kernel key, and Podman PIDs limits ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              sudo sysctl fs.inotify.max_user_watches=749973
              sudo sysctl fs.inotify.max_user_instances=512
              sudo sysctl kernel.keys.maxkeys=2000

              # Rootless Podman defaults to a 2048 PID limit. Inside Kind,
              # systemd applies roughly 15% of that limit to pod cgroups,
              # yielding pids.max=307 and fork failures under the full AO
              # stack. Raise the limit before deploy-ao creates Kind.
              mkdir -p \$HOME/.config/containers
              printf '%s\n' '[containers]' 'pids_limit = 65536' \
                > \$HOME/.config/containers/containers.conf
            "
        - name: login-to-registries
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            QUAY_USERNAME=$(cat /credentials/registry/quay-username 2>/dev/null || echo "")
            QUAY_TOKEN=$(cat /credentials/registry/quay-token 2>/dev/null || echo "")
            RH_REGISTRY_USER=$(cat /credentials/registry/rh-registry-username 2>/dev/null || echo "")
            RH_REGISTRY_TOKEN=$(cat /credentials/registry/rh-registry-token 2>/dev/null || echo "")

            echo "=== Logging in to registries on remote VM ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              if [ -n '${RH_REGISTRY_TOKEN}' ]; then
                echo '${RH_REGISTRY_TOKEN}' | podman login registry.redhat.io -u '${RH_REGISTRY_USER}' --password-stdin
              fi
              if [ -n '${QUAY_TOKEN}' ]; then
                echo '${QUAY_TOKEN}' | podman login quay.io -u '${QUAY_USERNAME}' --password-stdin
                echo '${QUAY_TOKEN}' | podman login quay.io/aap -u '${QUAY_USERNAME}' --password-stdin
              fi
            "
        - name: clone-syntara
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            GH_APP_ID=$(cat /credentials/nexus-github-app/orchestrator-ci-for-konflux-gh-app-id)
            GH_INSTALL_ID=$(cat /credentials/nexus-github-app/orchestrator-ci-for-konflux-gh-app-install-id)
            GH_PRIVATE_KEY=$(cat /credentials/nexus-github-app/orchestrator-ci-for-konflux-gh-app-private-key)

            echo "=== Generating GitHub App installation token ==="

            KEY_FILE=$(mktemp)
            chmod 600 "${KEY_FILE}"
            printf '%s' "${GH_PRIVATE_KEY}" > "${KEY_FILE}"

            NOW=$(date +%s)
            HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 | tr -d '=' | tr '+/' '-_' | tr -d '\n')
            PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW - 60))" "$((NOW + 540))" "${GH_APP_ID}" | base64 | tr -d '=' | tr '+/' '-_' | tr -d '\n')
            SIG=$(printf '%s' "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -sign "${KEY_FILE}" | base64 | tr -d '=' | tr '+/' '-_' | tr -d '\n')
            rm -f "${KEY_FILE}"

            JWT="${HEADER}.${PAYLOAD}.${SIG}"

            GH_TOKEN=$(curl -sS -X POST \
              -H "Authorization: Bearer ${JWT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/app/installations/${GH_INSTALL_ID}/access_tokens" | jq -r '.token')

            if [ -z "${GH_TOKEN}" ] || [ "${GH_TOKEN}" = "null" ]; then
              echo "ERROR: Failed to obtain GitHub App installation token" >&2
              exit 1
            fi

            echo "=== Cloning syntara at ${AO_REVISION} on remote VM ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              NEXUS_CLONE_URL=\"https://x-access-token:${GH_TOKEN}@github.com/syntara-orchestration/syntara.git\"
              if [ -d ~/syntara ]; then
                git -C ~/syntara fetch --all
              else
                git clone \"\${NEXUS_CLONE_URL}\" ~/syntara
              fi
              if [ -n '${AO_PR_NUMBER}' ]; then
                git -C ~/syntara fetch origin refs/pull/${AO_PR_NUMBER}/head
              fi
              git -C ~/syntara checkout ${AO_REVISION}
            "
        - name: clone-operator
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            if [ -z "${AO_OPERATOR_REVISION}" ]; then
              echo "=== ao-operator-revision not set; using the prebuilt operator bundle ==="
              exit 0
            fi

            SSH_HOST=$(cat /workspace/share/host)
            SSH_USER=$(cat /workspace/share/user)
            SSH_OPTS=(-i "${SSH_KEY}" -o StrictHostKeyChecking=no -o BatchMode=yes)

            # Kubernetes secret mounts are symlinks; find -type f misses them. The
            # glob tolerates both secret layouts (suffixed keys on the nexus-org
            # secret, exact keys on the syntara-org one).
            _cred() {
              local dir=/credentials/operator-github-app
              local suffix=$1
              local f
              f=$(find "${dir}" -maxdepth 1 -name "*${suffix}" | head -1)
              if [[ -z "${f}" || ! -e "${f}" ]]; then
                echo "ERROR: no *${suffix} in ${dir}" >&2
                ls -la "${dir}" >&2 || true
                exit 1
              fi
              cat "${f}"
            }
            GH_APP_ID=$(_cred -app-id)
            GH_INSTALL_ID=$(_cred -install-id)
            GH_PRIVATE_KEY=$(_cred -private-key)

            echo "=== Generating GitHub App installation token ==="

            KEY_FILE=$(mktemp)
            chmod 600 "${KEY_FILE}"
            printf '%s' "${GH_PRIVATE_KEY}" > "${KEY_FILE}"

            NOW=$(date +%s)
            HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | base64 | tr -d '=' | tr '+/' '-_' | tr -d '\n')
            PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW - 60))" "$((NOW + 540))" "${GH_APP_ID}" | base64 | tr -d '=' | tr '+/' '-_' | tr -d '\n')
            SIG=$(printf '%s' "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -sign "${KEY_FILE}" | base64 | tr -d '=' | tr '+/' '-_' | tr -d '\n')
            rm -f "${KEY_FILE}"

            JWT="${HEADER}.${PAYLOAD}.${SIG}"
            GH_TOKEN=$(curl -sS -X POST \
              -H "Authorization: Bearer ${JWT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/app/installations/${GH_INSTALL_ID}/access_tokens" | jq -r '.token')
            unset JWT GH_PRIVATE_KEY

            if [ -z "${GH_TOKEN}" ] || [ "${GH_TOKEN}" = "null" ]; then
              echo "ERROR: Failed to obtain GitHub App installation token" >&2
              exit 1
            fi

            echo "=== Cloning automation-orchestrator-operator at ${AO_OPERATOR_REVISION} on remote VM ==="
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "
              set -euo pipefail
              OP_CLONE_URL=\"${AO_OPERATOR_GIT_URL/https:\/\//https:\/\/x-access-token:${GH_TOKEN}@}\"
              if [ -d ~/automation-orchestrator-operator ]; then
                git -C ~/automation-orchestrator-operator fetch --all
              else
                git clone \"\${OP_CLONE_URL}\" ~/automation-orchestrator-operator
              fi
              if [ -n '${AO_OPERATOR_PR_NUMBER}' ]; then
                git -C ~/automation-orchestrator-operator fetch origin refs/pull/${AO_OPERATOR_PR_NUMBER}/head
              fi
              git -C ~/automation-orchestrator-operator checkout ${AO_OPERATOR_REVISION}
            "
        - name: clone-execution-plane
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            if [ -z "${EP_REVISION}" ]; then
