openapi: 3.1.0
info:
  title: Execution Plane API
  description: Command submission and client-scoped execution resources. No command
    history is retained.
  version: 1.0.0
paths:
  /v1/capabilities:
    get:
      summary: Capabilities
      operationId: capabilities_v1_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesRead'
      security:
      - HTTPBearer: []
  /v1/commands:
    post:
      summary: Receive Command
      operationId: receive_command_v1_commands_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportReceipt'
        '422':
          description: Invalid or unsupported command
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageEnvelope'
  /v1/work-items:
    get:
      summary: Work Items
      operationId: work_items_v1_work_items_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          exclusiveMinimum: 0
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - created_at
          - -created_at
          - status
          - -status
          - resource_cleanup_status
          - -resource_cleanup_status
          - id
          - -id
          type: string
          description: Work-item sort field; newest first by default.
          default: -created_at
          title: Sort
        description: Work-item sort field; newest first by default.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Total
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by id (id=value or id[operator]=value). Operators: eq,
          in, gt, gte, lt, lte, isnull. Comma-separated values use OR; different fields/operators
          use AND.'
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by status (status=value or status[operator]=value). Operators:
          eq, in, gt, gte, lt, lte, isnull. Comma-separated values use OR; different
          fields/operators use AND.'
      - name: created_at
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by created_at (created_at=value or created_at[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: claimed_at
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by claimed_at (claimed_at=value or claimed_at[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: completed_at
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by completed_at (completed_at=value or completed_at[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: resource_cleanup_status
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by resource_cleanup_status (resource_cleanup_status=value
          or resource_cleanup_status[operator]=value). Operators: eq, in, contains,
          starts_with, gt, gte, lt, lte, isnull. Comma-separated values use OR; different
          fields/operators use AND.'
      - name: resource_cleanup_error
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by resource_cleanup_error (resource_cleanup_error=value
          or resource_cleanup_error[operator]=value). Operators: eq, in, contains,
          starts_with, gt, gte, lt, lte, isnull. Comma-separated values use OR; different
          fields/operators use AND.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesResponse_WorkItemRead_'
        '422':
          description: Invalid query parameters or cursor
  /v1/work-items/{resource_id}:
    get:
      summary: Work Item
      operationId: work_item_v1_work_items__resource_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/clusters:
    get:
      summary: Clusters
      operationId: clusters_v1_clusters_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          exclusiveMinimum: 0
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - id
          - -id
          - created_at
          - -created_at
          - name
          - -name
          - endpoint
          - -endpoint
          - status
          - -status
          - enabled
          - -enabled
          - is_default
          - -is_default
          - updated_at
          - -updated_at
          type: string
          description: Cluster sort field; oldest first by default.
          default: created_at
          title: Sort
        description: Cluster sort field; oldest first by default.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Total
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by id (id=value or id[operator]=value). Operators: eq,
          in, gt, gte, lt, lte, isnull. Comma-separated values use OR; different fields/operators
          use AND.'
      - name: created_at
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by created_at (created_at=value or created_at[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: updated_at
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by updated_at (updated_at=value or updated_at[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by name (name=value or name[operator]=value). Operators:
          eq, in, contains, starts_with, gt, gte, lt, lte, isnull. Comma-separated
          values use OR; different fields/operators use AND.'
      - name: endpoint
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by endpoint (endpoint=value or endpoint[operator]=value).
          Operators: eq, in, contains, starts_with, gt, gte, lt, lte, isnull. Comma-separated
          values use OR; different fields/operators use AND.'
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by status (status=value or status[operator]=value). Operators:
          eq, in, gt, gte, lt, lte, isnull. Comma-separated values use OR; different
          fields/operators use AND.'
      - name: status_message
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by status_message (status_message=value or status_message[operator]=value).
          Operators: eq, in, contains, starts_with, gt, gte, lt, lte, isnull. Comma-separated
          values use OR; different fields/operators use AND.'
      - name: enabled
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by enabled (enabled=value or enabled[operator]=value).
          Operators: eq, in, isnull. Comma-separated values use OR; different fields/operators
          use AND.'
      - name: is_default
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by is_default (is_default=value or is_default[operator]=value).
          Operators: eq, in, isnull. Comma-separated values use OR; different fields/operators
          use AND.'
      - name: source_integration_id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by source_integration_id (source_integration_id=value
          or source_integration_id[operator]=value). Operators: eq, in, gt, gte, lt,
          lte, isnull. Comma-separated values use OR; different fields/operators use
          AND.'
      - name: labels[key]
        in: query
        required: false
        schema:
          type: string
        description: Replace key with a label key. Exact value match; empty value
          tests key existence.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesResponse_ClusterRead_'
        '422':
          description: Invalid query parameters or cursor
  /v1/clusters/{resource_id}:
    get:
      summary: Cluster
      operationId: cluster_v1_clusters__resource_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/execution-targets:
    get:
      summary: Targets
      operationId: targets_v1_execution_targets_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          exclusiveMinimum: 0
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - id
          - -id
          - created_at
          - -created_at
          - name
          - -name
          - endpoint
          - -endpoint
          - status
          - -status
          - backend_type
          - -backend_type
          - cluster_id
          - -cluster_id
          - enabled
          - -enabled
          - is_default
          - -is_default
          type: string
          description: Execution-target sort field; oldest first by default.
          default: created_at
          title: Sort
        description: Execution-target sort field; oldest first by default.
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Total
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by id (id=value or id[operator]=value). Operators: eq,
          in, gt, gte, lt, lte, isnull. Comma-separated values use OR; different fields/operators
          use AND.'
      - name: created_at
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by created_at (created_at=value or created_at[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by name (name=value or name[operator]=value). Operators:
          eq, in, contains, starts_with, gt, gte, lt, lte, isnull. Comma-separated
          values use OR; different fields/operators use AND.'
      - name: endpoint
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by endpoint (endpoint=value or endpoint[operator]=value).
          Operators: eq, in, contains, starts_with, gt, gte, lt, lte, isnull. Comma-separated
          values use OR; different fields/operators use AND.'
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by status (status=value or status[operator]=value). Operators:
          eq, in, gt, gte, lt, lte, isnull. Comma-separated values use OR; different
          fields/operators use AND.'
      - name: backend_type
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by backend_type (backend_type=value or backend_type[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: cluster_id
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by cluster_id (cluster_id=value or cluster_id[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: enabled
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by enabled (enabled=value or enabled[operator]=value).
          Operators: eq, in, isnull. Comma-separated values use OR; different fields/operators
          use AND.'
      - name: is_default
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by is_default (is_default=value or is_default[operator]=value).
          Operators: eq, in, isnull. Comma-separated values use OR; different fields/operators
          use AND.'
      - name: last_ran_at
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by last_ran_at (last_ran_at=value or last_ran_at[operator]=value).
          Operators: eq, in, gt, gte, lt, lte, isnull. Comma-separated values use
          OR; different fields/operators use AND.'
      - name: status_message
        in: query
        required: false
        schema:
          type: string
        description: 'Filter by status_message (status_message=value or status_message[operator]=value).
          Operators: eq, in, contains, starts_with, gt, gte, lt, lte, isnull. Comma-separated
          values use OR; different fields/operators use AND.'
      - name: labels[key]
        in: query
        required: false
        schema:
          type: string
        description: Replace key with a label key. Exact value match; empty value
          tests key existence.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcesResponse_ExecutionTargetRead_'
        '422':
          description: Invalid query parameters or cursor
  /v1/execution-targets/{resource_id}:
    get:
      summary: Target
      operationId: target_v1_execution_targets__resource_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTargetRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BackendType:
      type: string
      enum:
      - vanilla_k8s
      - openshell
      title: BackendType
      description: Supported execution target backends.
    CapabilitiesRead:
      properties:
        protocol_revision:
          type: integer
          const: 1
          title: Protocol Revision
          default: 1
        commands:
          additionalProperties:
            items:
              type: integer
            type: array
          type: object
          title: Commands
      additionalProperties: false
      type: object
      required:
      - commands
      title: CapabilitiesRead
      description: Command revisions installed by this participant.
    ClusterRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        source_integration_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Integration Id
        name:
          type: string
          title: Name
        endpoint:
          type: string
          title: Endpoint
        status:
          type: string
          title: Status
        status_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Message
        enabled:
          type: boolean
          title: Enabled
        is_default:
          type: boolean
          title: Is Default
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        project_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Project Ids
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - source_integration_id
      - name
      - endpoint
      - status
      - status_message
      - enabled
      - is_default
      - labels
      - project_ids
      - created_at
      - updated_at
      title: ClusterRead
      description: Provisioned cluster state, keyed by the actual cluster UUID.
    ExecutionTargetRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        cluster_id:
          type: string
          format: uuid
          title: Cluster Id
        name:
          type: string
          title: Name
        backend_type:
          $ref: '#/components/schemas/BackendType'
        endpoint:
          type: string
          title: Endpoint
        placement:
          oneOf:
          - $ref: '#/components/schemas/KubernetesPlacement'
          - $ref: '#/components/schemas/RHELPlacement'
          title: Placement
          discriminator:
            propertyName: type
            mapping:
              kubernetes: '#/components/schemas/KubernetesPlacement'
              rhel: '#/components/schemas/RHELPlacement'
        status:
          $ref: '#/components/schemas/TargetStatus'
        enabled:
          type: boolean
          title: Enabled
        is_default:
          type: boolean
          title: Is Default
        status_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Message
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        created_at:
          type: string
          format: date-time
          title: Created At
        last_ran_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Ran At
      type: object
      required:
      - id
      - cluster_id
      - name
      - backend_type
      - endpoint
      - placement
      - status
      - enabled
      - is_default
      - status_message
      - labels
      - created_at
      - last_ran_at
      title: ExecutionTargetRead
      description: Safe execution-target representation without management credentials.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KubernetesPlacement:
      properties:
        type:
          type: string
          const: kubernetes
          title: Type
          default: kubernetes
        namespace:
          type: string
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          title: Namespace
          description: Kubernetes namespace reserved for execution workloads
        node_selectors:
          items:
            type: string
          type: array
          title: Node Selectors
        tolerations:
          items:
            type: string
          type: array
          title: Tolerations
      type: object
      required:
      - namespace
      title: KubernetesPlacement
      description: Metadata required to place workers on Kubernetes.
    RHELPlacement:
      properties:
        type:
          type: string
          const: rhel
          title: Type
          default: rhel
      type: object
      title: RHELPlacement
      description: Placeholder for RHEL-specific execution-target metadata.
    ResourceReference:
      properties:
        kind:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[A-Za-z0-9_.:@/-]+$
          title: Kind
        resource_id:
          type: string
          format: uuid
          title: Resource Id
        resource_key:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Resource Key
        revision:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Revision
      additionalProperties: false
      type: object
      required:
      - kind
      - resource_id
      title: ResourceReference
      description: Safe reference from a command to a participant-owned resource.
    ResourcesResponse_ClusterRead_:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ClusterRead'
          type: array
          title: Resources
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        prev:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      required:
      - resources
      title: ResourcesResponse[ClusterRead]
    ResourcesResponse_ExecutionTargetRead_:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ExecutionTargetRead'
          type: array
          title: Resources
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        prev:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      required:
      - resources
      title: ResourcesResponse[ExecutionTargetRead]
    ResourcesResponse_WorkItemRead_:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/WorkItemRead'
          type: array
          title: Resources
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        prev:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
      type: object
      required:
      - resources
      title: ResourcesResponse[WorkItemRead]
    TargetStatus:
      type: string
      enum:
      - registering
      - validating
      - bootstrapping
      - active
      - degraded
      - draining
      - failed
      title: TargetStatus
      description: Lifecycle states of an execution target.
    TransportReceipt:
      properties:
        received:
          type: boolean
          const: true
          title: Received
          default: true
        message_id:
          type: string
          format: uuid
          title: Message Id
        resource:
          anyOf:
          - $ref: '#/components/schemas/ResourceReference'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - message_id
      title: TransportReceipt
      description: Receipt of a handled request, without a persisted command record.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkItemRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          $ref: '#/components/schemas/WorkItemStatus'
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        result_omitted:
          type: boolean
          title: Result Omitted
          default: false
        result_size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Result Size Bytes
        created_at:
          type: string
          format: date-time
          title: Created At
        claimed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Claimed At
        completed_at:
          anyOf:
          - type: string
