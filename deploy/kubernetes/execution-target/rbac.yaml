# Target-cluster RBAC for the Execution Plane dispatcher ServiceAccount.
# Applied by tools/deploy_kind_execution_target.py, the CI kind job, and
# docs/feature-branch-assets/konflux-prepare-execution-plane.sh.
# Keep verbs aligned with the vanilla-k8s transport: Jobs, list Pods,
# pods/portforward, and NetworkPolicies. Do not add Pod create, logs, or Secrets.
---
apiVersion: v1
kind: Namespace
metadata:
  name: execution-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syntara-dispatcher
  namespace: execution-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: syntara-node-dispatcher
  namespace: execution-plane
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["get", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: syntara-node-dispatcher
  namespace: execution-plane
subjects:
  - kind: ServiceAccount
    name: syntara-dispatcher
    namespace: execution-plane
roleRef:
  kind: Role
  name: syntara-node-dispatcher
  apiGroup: rbac.authorization.k8s.io
