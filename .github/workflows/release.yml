---
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-client:
    name: Publish execution-plane-client to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/execution-plane-client/
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so hatch-vcs derives the version from the
          # repository tags. fetch-depth: 0 alone does not fetch tags on a
          # branch ref (only on a tag checkout), which makes manual dispatch
          # builds derive 0.0.1.devN instead of X.Y.(Z+1).devN.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Build the client distribution
        # --out-dir dist so the publish action (and the guard below) find the
        # artifacts at the repository root; uv build's default output is
        # <package>/dist/.
        run: uv build --out-dir dist ./src/execution_plane_client/

      - name: Publish package distributions to PyPI
        # Tag pushes only: a manual dispatch on a branch derives a dev version
        # (X.Y.(Z+1).devN+g<sha>) and must never reach the registry.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/syntara-orchestration/execution-plane
          tags: |
            type=ref,event=tag
            type=sha
      - uses: ./.github/actions/container-build
        with:
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
