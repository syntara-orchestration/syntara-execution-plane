---
# Thin stub: the ao-ep-e2e pipeline, resolved via the Tekton git resolver
# from the unmerged aap-konflux-pipelines branch, which itself git-resolves
# the (also unmerged) tasks from goneri/promote-ep-e2e-staging-tasks. Tests
# the whole catalog promotion (aap-konflux-pipelines#4689) end to end before
# any bundle is published.
#
# Differences from the merged inline pipeline:
# - the pipeline body, the EP staging/patch/prepare tasks, and deploy-ao all
#   come from the catalog branch instead of living here
# - deploy-ao's new ep-revision param clones this PR's EP head itself (the
#   staged tree doubles as the tools and e2e source)
# Once aap-konflux-pipelines#4689 merges and publishes bundles, this stub
# flips to a digest-pinned pipelineRef.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: "{{source_url}}?rev={{revision}}"
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && target_branch == "devel"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: ansible-automation-orchestrator-devel
    appstudio.openshift.io/component: ansible-automation-orchestrator-execution-plane-devel
    pipelines.appstudio.openshift.io/type: test
  name: automation-orchestrator-e2e-devel-pull-request
  namespace: nexus-tenant
spec:
  timeouts:
    pipeline: "6h"
    tasks: "5h"
    finally: "1h"
  params:
    - name: git-url
      value: "{{source_url}}"
    - name: pipeline-github-org
      value: "{{repo_owner}}"
    - name: pipeline-github-repo
      value: "{{repo_name}}"
    - name: pipeline-github-pr-revision
      value: "{{revision}}"
    - name: pipeline-github-pr-number
      value: "{{pull_request_number}}"
    # This PR's Execution Plane head is what gets deployed and tested
    - name: ep-revision
      value: "{{revision}}"
    - name: ep-pr-number
      value: "{{pull_request_number}}"
    # Temporary pins until the matching branches land: aap-dev must
    # understand AO_EXECUTION_PLANE (ansible/aap-dev#1111), the prebuilt
    # operator devel bundle ignores ENABLE_EXECUTION_PLANE
    # (automation-orchestrator-operator#1573), and the AO under test needs
    # the EP script dispatch (feat/ANSTRAT-1803, the pipeline default).
    - name: aap-dev-revision
      value: AAP-90779-ep-from-source
    - name: ao-operator-revision
      value: AAP-90779-ep-from-source
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/ansible-automation-platform/aap-konflux-pipelines.git
      - name: revision
        value: goneri/ao-api-tests-ep-git-resolver
      - name: pathInRepo
        value: pipelines/test/ao-ep-e2e/0.1/pipeline.yaml
  taskRunTemplate:
    serviceAccountName: konflux-integration-runner
