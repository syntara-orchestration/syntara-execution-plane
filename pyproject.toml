[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execution-plane"
version = "0.1.0"
description = "Execution Plane worker and cluster management for Syntara"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Syntara contributors" }]
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "PyJWT[crypto]>=2.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.22",
    "structlog>=24.0.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/execution_plane"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/execution_plane",
    "README.md",
]

[project.scripts]
execution-plane-worker = "execution_plane.worker:main"
execution-plane-api = "execution_plane.api.main:main"

[project.urls]
Repository = "https://github.com/syntara-orchestration/syntara-execution-plane"
Issues = "https://github.com/syntara-orchestration/syntara-execution-plane/issues"

[dependency-groups]
dev = [
    "mypy>=1.18.0,<1.19.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.14.0,<0.14.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "PLR0913", "TRY300", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"src/execution_plane/migrations/**/*.py" = ["INP001", "D400", "D415", "PLR0915"]
"src/execution_plane/worker_manager/kubernetes_job.py" = ["TRY003", "EM101", "EM102"]
"tests/**/*.py" = [
    "INP001", "S101", "ANN001", "ANN201", "D102", "D103", "PLR2004",
    "TD002", "TD003", "ARG001", "ARG002", "SLF001", "PERF401", "S110",
    "BLE001", "SIM105", "PLC0415", "D401", "PT011", "PT012", "PGH003", "SIM117",
]
"**/__init__.py" = ["F401", "D104"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["src/execution_plane"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv.sources]
# The package is intentionally standalone; Syntara-specific adapters live in Syntara.
